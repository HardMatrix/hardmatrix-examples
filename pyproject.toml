[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "hardmatrix-examples"
version = "0.1.0"
description = "Public examples, demos, and companion code showcasing HardMatrix projects and workflows."
authors = [{ name = "HardMatrix" }]
readme = "README.md"
license = { file = "LICENSE" }
dependencies = [
    "pytest",
    "cocotb==2.0.1",
    "cocotb-bus@git+https://github.com/cocotb/cocotb-bus",
    "fusesoc",
    "fusesoc-openroad @ git+https://github.com/HardMatrix/fusesoc-openroad.git",
    "hydra-core",
]

[project.scripts]
hydra-sweep = "utils.sweep.cli:main"

[tool.setuptools]
# Helps when a MANIFEST.in is present; harmless otherwise
include-package-data = true

[tool.setuptools.packages.find]
where = ["shared/python"]
include = ["utils*"]

[tool.regression]
core-pattern = "^hardmatrix:examples:"
